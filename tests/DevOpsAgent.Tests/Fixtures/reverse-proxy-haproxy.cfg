__DVA_PROXY__:haproxy:/etc/haproxy/haproxy.cfg
global
    log /dev/log local0

frontend https_in
    bind *:443 ssl crt /etc/haproxy/certs/
    acl host_api hdr(host) -i api.example.test
    acl host_web hdr(host) -i app.example.test
    use_backend api_backend if host_api
    use_backend web_backend if host_web
    default_backend web_backend

backend api_backend
    balance roundrobin
    server api1 10.88.20.20:5000 check
    server api2 10.88.20.21:5000 check

backend web_backend
    server web1 10.88.20.20:3000 check

listen pg_tcp
    bind *:5433
    mode tcp
    server pg1 10.88.20.30:5432 check
