Host edge-web edge-api
    HostName 10.20.0.15
    User deploy
    Port 2222
    Port 2200
    IdentityFile ~/.ssh/devops_ed25519
    ProxyJump gateway
    ConnectTimeout 8

Host gateway
    HostName bastion.example.test
    User ops
    IdentityFile "/home/ops/keys/gateway key"

Host defaulted
    HostName defaulted.example.test

Host *.internal wildcard-*
    HostName should-not-import.example.test
    User ignored

Host !excluded exact-server
    HostName exact.example.test
    User service
    IdentityFile /keys/service_key
